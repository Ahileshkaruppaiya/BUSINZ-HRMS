services:
  payroll-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vrm_payroll_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - NODE_ENV=production
      - SUPABASE_URL=${SUPABASE_URL:-https://mock-supabase.local}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-mock-anon-key}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-mock-service-role-key}
      - JWT_SECRET=${JWT_SECRET:-vrm-hrms-production-jwt-secret-key-2026}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
